[package]
name = "harness"
version = "0.1.0"
edition = "2024"
description = "Immutable content-addressed session store: ingest and fixity validation for the encounter delivery harness"
license-file = "../LICENSE"
publish = false

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
